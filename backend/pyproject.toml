[project]
name = "dimsolaire-api"
version = "1.0.0"
description = "Moteur de dimensionnement photovoltaïque et API DimSolaire"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "reportlab>=4.2",
    "psutil>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.11",
]
web = [
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # Le vocabulaire métier et les messages sont en français : les
    # caractères accentués et les espaces insécables sont voulus.
    "RUF001",
    "RUF002",
    "RUF003",
    # `Depends()` en valeur par défaut est l'idiome d'injection de FastAPI.
    "B008",
    # `from ..engine import constantes as C` : l'alias court rend les
    # formules lisibles (C.JOURS_MOIS, C.SECTIONS).
    "N812",
    # `datetime.timezone.utc` reste explicite et compatible.
    "UP017",
]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["app.api.*", "app.db.*", "app.services.*", "app.rapports.*"]
strict = false

[tool.coverage.run]
source = ["app/engine"]
